[project]
name = "netafim-backend"
version = "0.1.0"
description = "API de pós-venda Netafim"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]

# Pacote não instalável: é só um projeto de aplicação, as dependências vêm do uv.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
