org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# URL da API. O emulador Android enxerga o computador em 10.0.2.2.
# Para outro ambiente: ./gradlew assembleDebug -Pnetafim.apiBaseUrl=https://.../api/v1/
netafim.apiBaseUrl=http://10.0.2.2:8000/api/v1/

# Domínio do App Link dos e-mails (convite e redefinição de senha), ex.: app.netafim.com.br.
# Deixe em branco no debug (vale o link de teste netafim://convite). O release exige um valor e HTTPS na API.
# netafim.linkHost=
