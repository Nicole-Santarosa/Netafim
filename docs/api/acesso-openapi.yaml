          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        telefone:
          type: string
          maxLength: 20
        senha:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - aceite_termo
      - email
      - nome
      - senha
      - versao_termo
    Cliente:
