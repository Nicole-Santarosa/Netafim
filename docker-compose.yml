# Ambiente local de desenvolvimento.
# PROVISÓRIO: criado junto com o módulo de acesso para a API rodar; alinhar com
# o responsável pela infraestrutura (infra/, Nginx, Object Storage) antes do merge.
#
# Uso: cp .env.example .env && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netafim}
      POSTGRES_USER: ${POSTGRES_USER:-netafim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-netafim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netafim}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
