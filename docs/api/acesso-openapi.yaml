      description: |-
        Lista e gerencia usuários no escopo do ator: o Netafim Admin vê todos; admins de
        distribuidor e de cliente veem só a própria organização.
      parameters:
      - in: query
        name: busca
        schema:
          type: string
        description: Parte do nome ou do e-mail
      - in: query
        name: id_cliente
        schema:
          type: integer
      - in: query
        name: id_distribuidor
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
